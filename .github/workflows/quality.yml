name: Quality Checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1

      - name: Upload TypeScript diagnostic log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: |
          tail -n 120 typecheck.log
          exit 1

      - name: Audit project structure
        if: steps.typecheck.outcome == 'success'
        run: npm run audit

      - name: Lint
        if: steps.typecheck.outcome == 'success'
        run: npm run lint

      - name: Production build
        if: steps.typecheck.outcome == 'success'
        run: npm run build
